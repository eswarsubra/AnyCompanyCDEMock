[pytest]
# Only collect the first-party test suites. Restricting testpaths (and ignoring
# the CDK build output) keeps pytest from crawling into cdk.out/asset.*/, whose
# bundled dependencies are built for the Lambda/Linux platform and would shadow
# the host environment's packages during collection.
testpaths =
    review_pipeline/tests
    handlers/tests
    generator/tests
    evaluation/tests
norecursedirs = cdk.out .venv node_modules .git
