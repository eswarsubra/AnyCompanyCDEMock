# ASH (Automated Security Helper) project configuration.
#
# Scope of suppressions below: every entry is a deliberate, justified
# prototype-vs-production trade-off, NOT a way to hide a real defect. The
# AWS-native IaC linters (cdk-nag AwsSolutionsChecks, cfn-nag) already pass with
# zero findings against the synthesized templates; the checkov entries here are
# the *same* hardening trade-offs cdk-nag flagged, re-raised by checkov (which
# does not read the in-template cdk-nag suppressions). Each is mirrored by a
# production-hardening note in docs/HANDOFF.md.
#
# Genuinely-fixed items are NOT suppressed: reserved concurrency (CKV_AWS_115)
# is set on all first-party Lambdas, and Step Functions retry/backoff provides
# the resilience a Lambda async DLQ cannot for a synchronous invoke.
project_name: anycompany-apparel-review-pipeline
fail_on_findings: true

global_settings:
  severity_threshold: MEDIUM

  ignore_paths:
    # Local CDK build virtualenv — third-party packages (pip/setuptools), never
    # deployed. The Lambda runtime deps are boto3 + anthropic, packaged
    # separately. grype CVEs here are about the local toolchain, not the app.
    - path: "**/.venv/**"
      reason: "Local build virtualenv; third-party toolchain only, never deployed. Runtime deps are packaged separately."
    # pytest's own cache directory — a build artifact, not source.
    - path: "**/.pytest_cache/**"
      reason: "pytest cache artifact, not committed source; its marker file trips high-entropy heuristics."
    # CDK Lambda asset bundles: pip-installed third-party packages (anthropic,
    # jsonschema, pydantic, rpds, ...) copied in at synth-time bundling. SAST on
    # vendored dependencies is noise (bandit flags their internal patterns, not
    # our code). Dependency CVEs are covered by grype/syft against the SBOM; the
    # synthesized CloudFormation (cdk.out/*.template.json) is still scanned by
    # cfn-nag/checkov. Excludes only the asset.* bundle dirs, not the templates.
    - path: "cdk.out/asset.*/**"
      reason: "CDK Lambda bundle = pip-installed third-party packages; SAST on vendored deps is noise. CFN templates still scanned; dep CVEs via grype/syft."

  suppressions:
    # === detect-secrets false positive ==================================
    # infra/app.py contains the AWS-managed-policy ARN string
    # "AmazonAPIGatewayPushToCloudWatchLogs" inside a cdk-nag suppression
    # *reason*. It is a public AWS identifier, not a credential.
    - rule_id: "SECRET-*"
      path: "infra/app.py"
      reason: "High-entropy match is a public AWS managed-policy ARN inside a cdk-nag suppression reason string, not a secret."

    # === checkov: Lambda hardening trade-offs (cdk.out synth output) =====
    # CKV_AWS_116 (DLQ): stages are invoked SYNCHRONOUSLY by Step Functions;
    # a Lambda async dead-letter queue never fires on a sync invoke. Failure
    # handling is done correctly at the state-machine level (retry + backoff).
    - rule_id: "CKV_AWS_116"
      path: "cdk.out/**"
      reason: "Lambdas are invoked synchronously (Step Functions / API GW); async DLQ never fires. Resilience is via Step Functions retry/backoff instead."
    # CKV_AWS_117 (VPC): prototype Lambdas reach only AWS APIs (S3, Bedrock,
    # Translate) over the public AWS endpoints with least-privilege IAM. VPC +
    # endpoints are a production network-isolation step (HANDOFF.md).
    - rule_id: "CKV_AWS_117"
      path: "cdk.out/**"
      reason: "Prototype; Lambdas call only AWS service APIs with scoped IAM. VPC + interface endpoints are documented production hardening (HANDOFF.md)."
    # CKV_AWS_173 (env-var CMK): env vars carry only non-secret config
    # (bucket name, region, model ids, threshold). Lambda already encrypts env
    # vars at rest with an AWS-managed key; a customer CMK is prod hardening.
    - rule_id: "CKV_AWS_173"
      path: "cdk.out/**"
      reason: "Lambda env vars hold only non-secret config (bucket, region, model ids); already encrypted with an AWS-managed key. Customer CMK is prod hardening (HANDOFF.md)."
    # CKV_AWS_158 (log-group CMK): CloudWatch Logs are encrypted with an
    # AWS-managed key by default; a customer-managed KMS key on log groups is a
    # production hardening step, not required for non-sensitive prototype logs.
    - rule_id: "CKV_AWS_158"
      path: "cdk.out/**"
      reason: "Log groups use default AWS-managed encryption; customer-managed KMS on logs is documented production hardening (HANDOFF.md)."
    # CKV_AWS_115 (reserved concurrency): set on all FIRST-PARTY Lambdas. The
    # only remaining hit is the CDK-generated S3 auto-delete custom-resource
    # Lambda, which the app does not author or control.
    - rule_id: "CKV_AWS_115"
      path: "cdk.out/**"
      reason: "Reserved concurrency IS set on all first-party Lambdas. Residual hit is the CDK-managed S3 auto-delete custom resource, which we do not author."

    # === checkov: API Gateway trade-offs (prototype read API) ============
    # CKV_AWS_120 (API caching): caching is a cost/perf optimization, not a
    # security control, and is left to the customer team to tune per market.
    - rule_id: "CKV_AWS_120"
      path: "cdk.out/**"
      reason: "API Gateway caching is a cost/perf tuning knob, not a security control; left for the customer team to configure per traffic (HANDOFF.md)."
    # CKV_AWS_59 (API authorization): the prototype read API serves
    # non-sensitive, public product-review summaries. An authorizer/WAF is
    # explicitly part of production hardening (HANDOFF.md), matching the
    # cdk-nag APIG4/COG4 suppressions.
    - rule_id: "CKV_AWS_59"
      path: "cdk.out/**"
      reason: "Prototype read API serves public, non-sensitive review summaries; authorizer/WAF is documented production hardening (HANDOFF.md)."

    # === checkov: S3 access-logs bucket self-logging =====================
    # CKV_AWS_18: this IS the server-access-logs bucket for the data bucket;
    # enabling access logging on it would create a logging loop. Same rationale
    # as the cdk-nag AwsSolutions-S1 suppression in infra/app.py.
    - rule_id: "CKV_AWS_18"
      path: "cdk.out/**"
      reason: "Target bucket is itself the server-access-logs bucket; self-logging would create a loop. Matches the cdk-nag AwsSolutions-S1 suppression."
